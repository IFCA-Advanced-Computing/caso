name: Create RPM and DEB packages

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
    # Path filters are not evaluated for tags, so packages are always built
    # for tags, but only for branches when the packaging may have changed.
    paths:
      - 'packaging/**'
      - 'pyproject.toml'
      - 'etc/caso/**'
      - '.github/workflows/packaging.yml'
  release:
    types: [created]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox tox-gh-actions
        python -m pip install poetry poetry-plugin-export

    - name: Test with tox
      run: tox

  build-sdist:
    runs-on: ubuntu-latest
    needs:
      - test
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Get cASO repo
        uses: actions/checkout@v4

      - name: Get package version
        id: version
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["version"])')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry

      - name: Build sdist file
        run: poetry build --format sdist

      - name: Upload sdist to be used for other jobs
        uses: actions/upload-artifact@v4
        with:
          path: dist/caso-${{ steps.version.outputs.version }}.tar.gz
          name: sdist
          if-no-files-found: error

      - name: Update source distribution artifacts to release
        if: github.event_name == 'release'
        uses: AButler/upload-release-assets@v2.0
        with:
          files: 'dist/*tar.gz'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          release-tag: ${{ github.ref_name }}

  build-deb:
    # Do not use actions/setup-python here: the package must be built with
    # the distribution Python and build dependencies. Debian 13 is used as it
    # provides Pydantic 2, which cASO requires (Ubuntu 24.04 only has 1.10).
    runs-on: ubuntu-latest
    container: debian:trixie
    needs:
      - test
      - build-sdist
    env:
      VERSION: ${{ needs.build-sdist.outputs.version }}
      DEBFULLNAME: Alvaro Lopez Garcia
      DEBEMAIL: aloga@ifca.unican.es
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Get cASO repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential dpkg-dev debhelper devscripts dh-python \
            python3-all python3-all-dev python3-poetry-core \
            pybuild-plugin-pyproject

      - name: Prepare the debian directory
        run: |
          cp -r packaging/debian debian
          if [ "$(dpkg-parsechangelog -S Version)" != "${VERSION}-1" ]; then
            dch --newversion "${VERSION}-1" --distribution stable \
              --force-distribution "New upstream release ${VERSION}."
          fi

      - name: Build the package
        run: |
          dpkg-buildpackage -b -us -uc
          mkdir -p dist
          mv ../*.deb dist/

      - name: Show package information
        run: |
          for deb in dist/*.deb; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
          done

      - name: Test the package installation
        run: |
          apt-get install -y ./dist/python3-caso_*.deb
          caso-extract --help

      - name: Upload DEB packages
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

      - name: Update DEB artifacts to release
        if: github.event_name == 'release'
        uses: AButler/upload-release-assets@v2.0
        with:
          files: 'dist/*.deb'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          release-tag: ${{ github.ref_name }}

  build-rpm:
    # cASO requires Python >= 3.10, so EL9 (Python 3.9) cannot be targeted.
    runs-on: ubuntu-latest
    container: rockylinux/rockylinux:10
    needs:
      - test
      - build-sdist
    env:
      VERSION: ${{ needs.build-sdist.outputs.version }}
    steps:
      - name: Install build tools
        run: |
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          dnf install -y rpm-build rpmdevtools python3-devel pyproject-rpm-macros

      - name: Get cASO repo
        uses: actions/checkout@v4

      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Build the package
        run: |
          rpmdev-setuptree
          cp packaging/redhat/caso.spec ~/rpmbuild/SPECS/
          cp "dist/caso-${VERSION}.tar.gz" ~/rpmbuild/SOURCES/
          # Install the build dependencies generated from pyproject.toml.
          # rpmbuild -br exits with 11 when it wrote the buildreqs package.
          rpmbuild -br --define "version ${VERSION}" ~/rpmbuild/SPECS/caso.spec || [ $? -eq 11 ]
          dnf builddep -y ~/rpmbuild/SRPMS/caso-*.buildreqs.nosrc.rpm
          rpmbuild -ba --define "version ${VERSION}" ~/rpmbuild/SPECS/caso.spec
          mkdir -p rpms
          cp ~/rpmbuild/RPMS/noarch/*.rpm ~/rpmbuild/SRPMS/*.src.rpm rpms/

      - name: Show package information
        run: |
          for rpm in rpms/*.noarch.rpm; do
            rpm -qip "$rpm"
            rpm -qlp "$rpm"
            rpm -qRp "$rpm"
          done

      - name: Upload RPM packages
        uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: rpms/*.rpm
          if-no-files-found: error

      - name: Update RPM artifacts to release
        if: github.event_name == 'release'
        uses: AButler/upload-release-assets@v2.0
        with:
          files: 'rpms/*.rpm'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          release-tag: ${{ github.ref_name }}
